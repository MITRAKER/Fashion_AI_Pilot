<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Showroom</title>
    <style>
      html, body { margin: 0; height: 100%; background: #08080a; overflow: hidden; }
      canvas { display: block; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center;
              color: #55555f; font: 12px/1.4 system-ui; letter-spacing: .14em;
              text-transform: uppercase; transition: opacity .6s; }
      #boot.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="boot">Atelier</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
